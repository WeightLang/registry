name: Validate package index
on:
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Run the validator from the trusted base; never execute scripts supplied by a package PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Validate proposed records and release hashes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$HEAD_SHA"
          python scripts/validate.py --base "$BASE_SHA" --head "$HEAD_SHA" --verify-assets
